name: Test and publish Penny
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: penny-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install OCR and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng shellcheck
          pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: node --check app/static/app.js
      - name: Validate deployment
        env:
          DASHBOARD_PASSWORD: github-ci-placeholder-password
          MONEY_DATA_VOLUME: penny-ci-placeholder-volume
        run: |
          bash -n deploy/update.sh deploy/install-auto-update.sh
          shellcheck deploy/update.sh deploy/install-auto-update.sh
          python -m unittest discover -s deploy/tests -v
          docker compose config --quiet
          docker compose -f compose.production.yaml --profile telegram config --quiet
  publish:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify isolated container and private-data exclusions
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:size=128m,mode=1777 --tmpfs /data:uid=10001,gid=10001 --entrypoint python "$IMAGE" -c 'import os,shutil; from pathlib import Path; assert os.getuid()==10001; assert not Path("/app/.env").exists(); assert not Path("/app/tests").exists(); assert not any(Path("/data").iterdir()); assert shutil.which("tesseract"); from app.core import Ledger; from app.graphs import render_summary; assert render_summary(Ledger().summary()).startswith(b"\x89PNG")'
      - name: Publish verified image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          docker push "$IMAGE:sha-$REVISION"
          docker tag "$IMAGE:sha-$REVISION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
